[project]
name = "mha-exp-level1"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mhagenta==1.4.12",
    "mha-exp-common",
    "matplotlib>=3.10,<4",
    "numpy~=2.4.4",
    "scipy~=1.17.1",
]

[project.entry-points."mhagenta_experiments"]
"1.1" = "mha_exp_level1.exp1_1:run_batch"
"1.2" = "mha_exp_level1.exp1_2:run_batch"
"1.3" = "mha_exp_level1.exp1_3:run_batch"
"1.4" = "mha_exp_level1.exp1_4:run_batch"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"
