[project]
name = "mha-exp-level2-cr"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "mhagenta==1.4.12",
    "mha-exp-common",
    "mha-env-crafter",
    "numpy~=2.4.4",
    "openai>=2.0,<3.0",
    "pillow>=12,<13",
    "pywin32>=311; sys_platform == 'win32'",
    "setuptools<81",
    "unified-planning[lpg]~=1.3.0",
]

[project.optional-dependencies]
playback = [
    "pygame~=2.6.1",
    "torch==2.13.0",
]
policies = [
    "torch==2.13.0",
]

[project.scripts]
mha-exp-2-2-cr-play = "mha_exp_level2_cr.exp2_2.play_policy:main"

[project.entry-points."mhagenta_experiments"]
"2.cr.1" = "mha_exp_level2_cr.exp2_1:run_batch"
"2.cr.2" = "mha_exp_level2_cr.exp2_2:run_batch"
"2.cr.3" = "mha_exp_level2_cr.exp2_3:run_batch"
"2.cr.4" = "mha_exp_level2_cr.exp2_4:run_batch"
"2.cr.5" = "mha_exp_level2_cr.exp2_5:run_batch"
"2.cr.6" = "mha_exp_level2_cr.exp2_6:run_batch"
"2.cr.7" = "mha_exp_level2_cr.exp2_7:run_batch"
"2.cr.7.extended" = "mha_exp_level2_cr.exp2_7:run_extended_batch"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"
