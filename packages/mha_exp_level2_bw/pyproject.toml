[project]
name = "mha-exp-level2-bw"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mhagenta==1.4.12",
    "mha-exp-common",
    "mha-env-blocksworld",
    "numpy~=2.4.4",
    "openai>=2.0,<3.0",
    "pywin32>=311; sys_platform == 'win32'",
    "setuptools<81",
    "unified-planning[lpg,enhsp]~=1.3.0",
]

[project.optional-dependencies]
playback = [
    "torch==2.13.0",
]
policies = [
    "torch==2.13.0",
]

[project.scripts]
mha-exp-2-2-bw-play = "mha_exp_level2_bw.exp2_2.play_policy:main"

[project.entry-points."mhagenta_experiments"]
"2.bw.1" = "mha_exp_level2_bw.exp2_1:run_batch"
"2.bw.2" = "mha_exp_level2_bw.exp2_2:run_batch"
"2.bw.3" = "mha_exp_level2_bw.exp2_3:run_batch"
"2.bw.4" = "mha_exp_level2_bw.exp2_4:run_batch"
"2.bw.5" = "mha_exp_level2_bw.exp2_5:run_batch"
"2.bw.5.matched" = "mha_exp_level2_bw.exp2_5:run_matched_batch"
"2.bw.6" = "mha_exp_level2_bw.exp2_6:run_batch"
"2.bw.7" = "mha_exp_level2_bw.exp2_7:run_batch"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"
